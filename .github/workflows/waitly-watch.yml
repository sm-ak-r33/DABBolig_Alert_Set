name: Waitly Watch

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "*/5 7-23 * * 1-5"

concurrency:
  group: waitly-watch
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-waitly:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Restore previous Waitly alert state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: waitly-state-${{ github.run_id }}
          restore-keys: |
            waitly-state-

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check Waitly availability
        env:
          WAITLY_URL: https://waitly.eu/da/soegning?search=Copenhagen,+Danmark&address=d52cbf2048515d4feeac41b96c9e926390ab4f8d3fb4e0b10088c218b87926a180db958f167b69f899b6e68616b10389&type=rental_housing
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run check:waitly

      - name: Save Waitly alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: waitly-state-${{ github.run_id }}
